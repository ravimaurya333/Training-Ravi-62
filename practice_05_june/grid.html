<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .main{
            display: grid;
            width: 100%;
            height: 30rem;
           grid-template-columns: auto auto auto;
            grid-auto-rows: 100px;
            border: 2px solid black;
            gap: 5px;
            /* justify-content: space-between; */
            /* justify-content: space-evenly ; */
            /* align-items: center; */
            align-content: space-around;

            /* align-items: center; */
            
        }
        .box{
            border: 2px solid rgb(17, 191, 145);
            background-color: lightcoral;
            
        }
        #b1{
            /* justify-self: start;
            align-self: end; */
            /* align-self: start; */
            /* grid-column: -2/-4; */
            /* grid-column: -2/2; */
            /* grid-column: 1/5; */
            /* grid-column: 1/span 3; */
            /* grid-row: 1/span 3; */
            /* grid-row: 1/3; */
            /* grid-row: -1/-3; */
            grid-area: 1/1/span 2/span 3;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="b1">box-1 </div>
        <div class="box"  id="b2">box-2</div>
        <div class="box"  id="b3">box-3</div>
        <div class="box"  id="b4">box-4</div>
        <div class="box"   id="b5">box-5</div>
        <div class="box"  id="b6">box-6</div>
        <div class="box"  id="b7">box-7</div>
    </div>
</body>
</html>
