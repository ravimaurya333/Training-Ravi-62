<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <style>
        h1{
            text-align: center;
        }
        .profile-card{
            text-align: center;
            width: 225px;
            height: 400px;

            border: 5px solid black;
        }
        #photo{
            background: url() no-repeat;
            background-size: 100% 100%;
            margin: auto;
            width: 100px;
            height: 100px;
            border: 3px solid black;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h1>Profile Card</h1>
        <div id="photo">

        </div>
        <div id="info">
            <h3>BTech CSE</h3>
            <p>Name-Ravi Maurya</p>
            <p>Batch-8</p>
            <p>Roll No-62</p>
            <button>FOLLOW</button>
        </div>
    </div>
</body>
</html>
