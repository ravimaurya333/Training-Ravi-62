<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <style>
        h1{
            text-align: center;
            color: darkslateblue;
        }
        .profile-card{
            text-align: center;
            width: 225px;
            height: 400px;

            border: 5px solid black;
            background-color: beige;
        }
        #photo{
            /* background: url(profile_pic.png) no-repeat;
            background-size: 100% 100%; */
            overflow: hidden;
            margin: auto;
            width: 100px;
            height: 100px;
            border: 3px solid black;
            border-radius: 50%;
        }
        #imgg{
            /* overflow: hidden; */
        }
        p{
           font-weight: bold;
            
        }
        a{
            text-decoration: none;
            background-color: aliceblue;
            color:black;
            border: 1px solid black; 
            display: inline-block;
            padding: 3px ;
            font-weight: bold;
            border-radius: 4px;

        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h1>Profile Card</h1>
        <div id="photo">    
            <img  id="imgg" src="./profile_pic.png" alt="" width="100px">
        </div>
        <div id="info">
            <h3>BTech CSE</h3>
            <p id="name">Name-Ravi Maurya</p>
            <p id="batch">Batch-8</p>
            <p id="rl">Roll No-62</p>

            <a href="https://www.linkedin.com/in/ravimaurya24/" target="_blank">FOLLOW</a>
            <button id="change"  href="" onclick="{changeBtn()}">Change</button>
            <a href="https://www.linkedin.com/in/ravimaurya24/" target="_blank">Linkedin</a>
        </div>
    </div>



    <script>
        let a=document.getElementById("imgg")
        let Name=document.getElementById("name")
        let Batch=document.getElementById("batch")
        let Rl=document.getElementById("rl")
        function changeBtn(){
            a.setAttribute("src","https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQz3XbgqPWjpcGeuSXJJq-pOo7acTbDktc7FYvWsLVSUeu3FVFMOxUdOvcj&s=10")
            Name.innerHTML="Name-Alex"
            Batch.innerHTML="Batch-10"
            Rl.innerHTML="Roll No-23"
        }
    </script>
</body>
</html>
