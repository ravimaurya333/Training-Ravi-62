<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: antiquewhite;
        }
        .card{
            position: relative;
            border: 2px solid black;
            width: 230px;
            height: 250px;
            margin-left: 600px;
            margin-top: 200px;
            border-radius: 10px;
        }
        .pic{
            /* border: 2px solid black; */
            height: 160px;
            background: url(https://m.media-amazon.com/images/I/612Td6jh-QL._SY695_.jpg);
            background-size: 100% 100%;
            border-radius: 5px;
        }
        .pic p{
            position: absolute;
            background-color: red;
            margin-top: 4px;
            margin-left: 3px;
            border-radius: 5px;
        }
        .info{
            margin-top: 5px;
            margin-left: 20px;
        }
        .info h3{
            color: green;
        }
        .button{
            /* display: inline-block; */
            border: 1px solid white;
            margin: auto;
            width: 90%;
            text-align: center;
            color: white;
            background-color: rgb(14, 14, 14);
            border-radius: 5px;
            cursor: pointer;
        }
        .heart{
            display: inline-block;
            position: absolute;
            background: none;
            border: 1px solid black;
            border-radius: 50%;
            /* padding: 5px; */
            margin-top: 3px;
            margin-left: 200px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="pic">
            <p>SALE</p>
            <span class="heart">❤️</span>
        </div>
        <div class="info">

            <h2>Running Shoes</h2>
            <h3>$320</h3>
        </div>
        <div class="button">
            <!-- <p>Add to Card</p> -->
             Add to Cart
        </div>
    </div>
</body>
</html>
